name: release

# Manual release pipeline.
#
# Job 1 (game-ci editor container) collects compile-time reference
# assemblies for the game's Unity version:
#   - engine modules: copied from the installed editor's Windows player
#     variation (same binaries the player ships)
#   - player BCL (mscorlib/netstandard/System...): extracted from the
#     official Windows Mono TargetSupportInstaller (.pkg, mac-hosted)
#   - Newtonsoft.Json.dll: prebuilt DLL from the official UPM package
#   - uGUI + TextMeshPro: source-only UPM packages, compiled later in job 2
#
# Job 2 (Windows) compiles uGUI/TMP with Roslyn, builds the plugin
# against the assembled fake game root, packs the full BepInEx runtime
# and publishes a pre-release tagged with the short commit hash.
#
# All external versions below were verified against their live sources:
#   actions/checkout        v7.0.1   GitHub API, 2026-08-24
#   actions/setup-dotnet    v6.0.0   GitHub API, 2026-08-24
#   actions/upload-artifact v7.0.1   GitHub API, 2026-08-24
#   actions/download-artifact v8.0.1 GitHub API, 2026-08-24
#   7zip linux tarball      26.02    ip7z/7zip latest asset, 2026-08-24
#   com.unity.nuget.newtonsoft-json 3.2.2   packages.unity.com, 2026-08-24
#   com.unity.textmeshpro   3.0.6    packages.unity.com, 2026-08-24
#   game-ci image tag ...-3.2.2      Docker Hub tags, 2026-08-24

on:
  workflow_dispatch:
    inputs:
      bepinex_version:
        description: 'BepInEx runtime version'
        required: true
        default: '5.4.23.5'
      unity_version:
        description: 'Unity editor version'
        required: true
        default: '2022.3.62f2'

permissions:
  contents: write

env:
  GAME_ROOT: ${{ github.workspace }}/gameroot

jobs:
  collect-unity-refs:
    name: Collect Unity reference assemblies
    runs-on: ubuntu-latest
    container:
      image: unityci/editor:ubuntu-${{ inputs.unity_version }}-windows-mono-3.2.2
    steps:
      # ------------------------------------------------------------------
      # Engine modules + player BCL from the official TargetSupportInstaller.
      # The editor ships Windows player modules in-tree, but the net48 BCL
      # only exists inside the support installer package.
      # ------------------------------------------------------------------
      - name: Collect engine modules and player BCL
        shell: bash
        run: |
          set -euo pipefail
          UNITY_PATH="${UNITY_PATH:-/opt/unity}"
          PLAYER_MANAGED="$UNITY_PATH/Editor/Data/PlaybackEngines/WindowsStandaloneSupport/Variations/win64_player_nondevelopment_mono/Data/Managed"

          mkdir -p refs
          cp "$PLAYER_MANAGED/"*.dll refs/
          echo "engine modules: $(ls refs | wc -l)"

          echo "-- resolving Windows-Mono support package via Unity Release API --"
          REL_JSON=$(curl -fsSL "https://services.api.unity.com/unity/editor/release/v1/releases?version=${{ inputs.unity_version }}&limit=1")
          echo "$REL_JSON" > rel.json
          PKG_URL=$(grep -o '"url":"[^"]*MacEditorTargetInstaller/UnitySetup-Windows-Mono-Support-for-Editor[^"]*"' rel.json | head -n1 | cut -d'"' -f4)
          if [ -z "$PKG_URL" ]; then
            echo "::error::support package url not found; api response head:"
            head -c 600 rel.json
            exit 1
          fi
          echo "pkg: $PKG_URL"

          echo "-- installing extraction tools --"
          apt-get update -qq >/dev/null
          apt-get install -y -qq cpio >/dev/null
          curl -fsSL "https://github.com/ip7z/7zip/releases/download/26.02/7z2602-linux-x64.tar.xz" -o 7z.tar.xz
          mkdir 7zz
          tar -xJf 7z.tar.xz -C 7zz

          echo "-- downloading and extracting support package --"
          curl -fsSL "$PKG_URL" -o tsi.pkg
          mkdir tsipkg
          ./7zz/7zz x -y tsi.pkg -otsipkg >/dev/null
          PAYLOAD=$(find tsipkg -name Payload | head -n1)
          if [ -z "$PAYLOAD" ]; then
            echo "::error::Payload not found in pkg; tree head:"
            find tsipkg -maxdepth 3 | head -n20
            exit 1
          fi

          PDIR=$(dirname "$PAYLOAD")
          (
            cd "$PDIR"
            # Payload is gzip-wrapped cpio. cpio often reports a non-fatal
            # "premature end" on trailing padding, so its exit code is
            # ignored and success is judged by the presence of mscorlib.
            gunzip -c Payload > payload.cpio
            cpio -idm < payload.cpio >/dev/null 2>&1 || true
          )
          CORE_DLL=$(find tsipkg -type f -name 'UnityEngine.CoreModule.dll' | head -n1)
          if [ -z "$CORE_DLL" ]; then
            echo "::error::player BCL not found after extraction; tree head:"
            find tsipkg -maxdepth 5 -type d | head -n30
            exit 1
          fi
          WIN_MANAGED=$(dirname "$CORE_DLL")
          cp "$WIN_MANAGED/"*.dll refs/
          echo "player BCL merged; total refs now $(ls refs | wc -l)"
          if [ ! -f refs/netstandard.dll ]; then
            echo "::warning::netstandard.dll not present in TSI Managed (expected; the net48 SDK supplies a forwarding facade)"
          fi

      # ------------------------------------------------------------------
      # Official UPM assets: prebuilt Newtonsoft.Json.dll plus the
      # script-only uGUI / TextMeshPro packages used by job 2.
      # ------------------------------------------------------------------
      - name: Collect official UPM assets
        shell: bash
        run: |
          set -euo pipefail
          UNITY_PATH="${UNITY_PATH:-/opt/unity}"

          PKG=com.unity.nuget.newtonsoft-json
          curl -fsSL "https://packages.unity.com/$PKG/-/$PKG-3.2.2.tgz" -o newtonsoft.tgz
          mkdir nt
          tar -xzf newtonsoft.tgz -C nt
          NJSON_DLL=$(find nt -name 'Newtonsoft.Json.dll' ! -path '*AOT*' | head -n1)
          if [ -z "$NJSON_DLL" ]; then
            echo "::error::Newtonsoft.Json.dll missing from UPM package"
            exit 1
          fi
          cp "$NJSON_DLL" refs/

          UGUI_SRC="$UNITY_PATH/Editor/Data/Resources/PackageManager/BuiltInPackages/com.unity.ugui"
          if [ ! -d "$UGUI_SRC/Runtime" ]; then
            echo "::error::built-in uGUI package missing at $UGUI_SRC"
            exit 1
          fi
          mkdir -p srcout/ugui srcout/tmp
          cp -r "$UGUI_SRC/Runtime/." srcout/ugui/

          PKG=com.unity.textmeshpro
          curl -fsSL "https://packages.unity.com/$PKG/-/$PKG-3.0.6.tgz" -o tmp.tgz
          mkdir tt
          tar -xzf tmp.tgz -C tt
          cp -r tt/package/Scripts/Runtime/. srcout/tmp/

          echo "refs: $(ls refs | wc -l) dlls; ugui sources: $(find srcout/ugui -name '*.cs' | wc -l); tmp sources: $(find srcout/tmp -name '*.cs' | wc -l)"
          test "$(ls refs | wc -l)" -ge 60 || { echo "::error::suspiciously few reference dlls"; exit 1; }

      - name: Upload reference assemblies and script sources
        uses: actions/upload-artifact@v7.0.1
        with:
          name: game-refs
          path: |
            refs/
            srcout/

  build-and-release:
    name: Build and publish pre-release
    runs-on: windows-latest
    needs: collect-unity-refs
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set short commit hash
        shell: pwsh
        run: Add-Content $env:GITHUB_ENV "SHORT_HASH=$($env:GITHUB_SHA.Substring(0, 7))"

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 8.0.x

      - name: Download BepInEx runtime
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          BEPINEX_VERSION: ${{ inputs.bepinex_version }}
        run: |
          $ErrorActionPreference = 'Stop'
          # Newer gh builds validate asset digests and reject some legacy
          # uploads outright; downgrade that to a warning and rely on our
          # own size check instead.
          gh config set digest_mismatch_validation warn 2>$null
          $ok = $false
          foreach ($attempt in 1..3) {
            Write-Host "download attempt $attempt"
            $dlArgs = @(
              'release', 'download', "v$env:BEPINEX_VERSION",
              '--repo', 'BepInEx/BepInEx',
              '--pattern', 'BepInEx_win_x64_*.zip',
              '--output', 'bepinex.zip', '--clobber'
            )
            & gh @dlArgs
            if ($LASTEXITCODE -eq 0 -and (Test-Path bepinex.zip)) { $ok = $true; break }
            Start-Sleep -Seconds (10 * $attempt)
          }
          if (-not $ok) { throw 'BepInEx runtime download failed after retries' }
          $zip = Get-Item bepinex.zip
          Write-Host "bepinex.zip: $([math]::Round($zip.Length / 1KB, 0)) KB"
          # Official BepInEx_win_x64 zip is ~0.6 MB (doorstop loader only);
          # guard against HTML error pages / truncated transfers.
          if ($zip.Length -lt 300KB) { throw "bepinex.zip too small: $($zip.Length) bytes" }

      - name: Download reference assemblies and script sources
        uses: actions/download-artifact@v8.0.1
        with:
          name: game-refs
          path: gameci-refs

      - name: Assemble fake game root
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $managed = Join-Path $env:GAME_ROOT 'Chill With You_Data/Managed'
          New-Item -ItemType Directory -Force $managed | Out-Null
          Copy-Item 'gameci-refs/refs/*.dll' $managed -Force
          # Deliberately no netstandard.dll here: a full-defining ref assembly
          # would duplicate types against mscorlib (CS0433). The net48 SDK
          # supplies its own forwarding facade instead.
          $count = (Get-ChildItem $managed -Filter *.dll).Count
          Write-Host "managed dlls: $count"
          if ($count -lt 60) { throw "fake game root looks incomplete ($count dlls)" }

      - name: Compile UnityEngine.UI and Unity.TextMeshPro
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $managed = Join-Path $env:GAME_ROOT 'Chill With You_Data/Managed'
          $sdkDir = Get-ChildItem "$env:DOTNET_ROOT/sdk" | Sort-Object Name -Descending | Select-Object -First 1
          $csc = Join-Path $sdkDir.FullName 'Roslyn/bincore/csc.dll'

          function Invoke-Csc([string]$OutDll, [string]$SrcDir) {
            # UPM packages ship Properties/AssemblyInfo.cs which needs BCL
            # attribute types; skip it, the compiler generates equivalents.
            $srcs = Get-ChildItem $SrcDir -Recurse -Filter *.cs |
              Where-Object { $_.FullName -notmatch '[\\/]Properties[\\/]AssemblyInfo\.cs$' } |
              ForEach-Object FullName
            if (-not $srcs) { throw "no sources in $SrcDir" }
            $argv = @('-nologo', '-target:library', '-noconfig', '-nostdlib+', "-out:$OutDll")
            Get-ChildItem $managed -Filter *.dll | ForEach-Object { $argv += "-r:$($_.FullName)" }
            # Bare compiles need System.* namespaces: add the SDK's
            # netstandard reference pack (never into Managed itself).
            $nsref = Get-ChildItem "$env:DOTNET_ROOT/packs/NETStandard.Library.Ref" -Recurse -Filter netstandard.dll | Select-Object -First 1
            if ($nsref) { $argv += "-r:$($nsref.FullName)" }
            foreach ($s in $srcs) { $argv += $s }
            Write-Host "compiling $OutDll ($($srcs.Count) files)"
            & dotnet $csc @argv
            if ($LASTEXITCODE -ne 0) { throw "compile failed for $OutDll" }
          }

          Invoke-Csc (Join-Path $managed 'UnityEngine.UI.dll') "$env:GITHUB_WORKSPACE/gameci-refs/srcout/ugui"
          Invoke-Csc (Join-Path $managed 'Unity.TextMeshPro.dll') "$env:GITHUB_WORKSPACE/gameci-refs/srcout/tmp"

      - name: Build plugin
        shell: pwsh
        run: >
          dotnet build src/MusicBridge.Plugin/MusicBridge.Plugin.csproj
          -c Release
          -p:GameDir="$env:GAME_ROOT"

      - name: Stage package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = 'Chill With You Lo-Fi Story'
          Expand-Archive bepinex.zip -DestinationPath $stage -Force
          $plugDir = Join-Path $stage 'BepInEx/plugins/ChillWithYouMusicBridge'
          New-Item -ItemType Directory -Force $plugDir | Out-Null
          Copy-Item 'src/MusicBridge.Plugin/bin/Release/MusicBridge.Plugin.dll' $plugDir
          Copy-Item 'src/MusicBridge.Plugin/bin/Release/MusicBridge.Plugin.pdb' $plugDir
          Compress-Archive -Path $stage -DestinationPath "MusicBridge_$($env:SHORT_HASH).zip" -Force
          $zip = Get-Item "MusicBridge_$($env:SHORT_HASH).zip"
          # Full package = doorstop loader (~0.6 MB) + BepInEx core +
          # plugin dll/pdb: expect roughly 1-2 MB total.
          if ($zip.Length -lt 500KB) { throw "package suspiciously small: $($zip.Length) bytes" }
          Write-Host "package: $($zip.Name) ($([math]::Round($zip.Length / 1MB, 1)) MB)"

      - name: Resolve changelog base tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          # Changelog starts at the most recent existing release; fall back
          # to the upstream v1.2.0 on a fresh repository.
          $latest = gh release list --limit 1 --json tagName --jq '.[0].tagName' 2>$null
          if (-not $latest) { $latest = 'v1.2.0' }
          Add-Content $env:GITHUB_ENV "CHANGELOG_BASE=$latest"
          Write-Host "changelog base: $latest"

      - name: Write release notes
        shell: pwsh
        env:
          BEPINEX_VERSION: ${{ inputs.bepinex_version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $notes = Get-Content .github/release-notes-template.md -Raw
          $notes = $notes.Replace('{{REPO}}', $env:GITHUB_REPOSITORY)
          $notes = $notes.Replace('{{hash}}', $env:SHORT_HASH)
          $notes = $notes.Replace('{{base}}', $env:CHANGELOG_BASE)
          $notes = $notes.Replace('{{bepinex}}', $env:BEPINEX_VERSION)
          Set-Content RELEASE_NOTES.md -Value $notes -NoNewline

      - name: Create pre-release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:SHORT_HASH
          $ghArgs = @(
            'release', 'create', $tag,
            '--prerelease',
            "--target=$env:GITHUB_SHA",
            '--title', "MusicBridge $tag",
            '--notes-file', 'RELEASE_NOTES.md',
            "MusicBridge_$tag.zip"
          )
          & gh @ghArgs
